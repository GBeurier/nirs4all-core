name: CI

on:
  workflow_dispatch:
    inputs:
      repair_tag:
        description: "Optional immutable tag repair; leave empty for ordinary qualification"
        required: false
        type: string
        default: ""
      methods_ref:
        description: "Optional immutable Methods commit for coordinated pre-release qualification"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
      - "rc/**"
      - "fix/v1-stability-core"
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:

jobs:
  repair-guard:
    name: Guard qualification source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
      - name: Validate repair source and version
        env:
          REPAIR_TAG: ${{ inputs.repair_tag }}
          METHODS_REF: ${{ inputs.methods_ref }}
        run: |
          set -euo pipefail
          scripts/bump_version.sh --check
          python3 scripts/check_ci_source.py --repair-tag "$REPAIR_TAG" --methods-ref "$METHODS_REF"
          python3 -m unittest discover -s tests -p test_ci_source.py

  rust:
    needs: repair-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve published binding and pinned Methods runtime
        id: n4m-release
        shell: python
        run: |
          import os
          from pathlib import Path
          import tomllib

          manifest = tomllib.loads(Path("bindings/rust/nirs4all/Cargo.toml").read_text())
          requirement = manifest["dependencies"]["n4m"]["version"]
          if not requirement.startswith("="):
              raise SystemExit(f"n4m must remain exactly pinned, got {requirement!r}")
          version = requirement.removeprefix("=")
          upstreams = tomllib.loads(Path("compat/upstreams.toml").read_text())["upstream"]
          methods = [entry for entry in upstreams if entry["key"] == "methods"]
          if len(methods) != 1:
              raise SystemExit("exactly one Methods runtime source pin is required")
          runtime_ref = methods[0]["ref"]
          if len(runtime_ref) != 40 or any(char not in "0123456789abcdef" for char in runtime_ref):
              raise SystemExit("Methods runtime must use an immutable lowercase commit SHA")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag=n4m-v{version}\n")
              output.write(f"runtime_ref={runtime_ref}\n")
      - uses: actions/checkout@v7.0.0
        with:
          repository: GBeurier/nirs4all-methods
          ref: ${{ inputs.methods_ref || steps.n4m-release.outputs.runtime_ref }}
          path: nirs4all-methods
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build
      - name: Build libn4m from its pinned runtime source
        run: |
          cmake --preset dev-release
          cmake --build --preset dev-release --target n4m_c --parallel
        working-directory: nirs4all-methods
      - name: Resolve the regular libn4m identity
        run: |
          set -euo pipefail
          library=$(realpath nirs4all-methods/build/dev-release/cpp/src/libn4m.so)
          if [ ! -f "${library}" ] || [ -L "${library}" ]; then
            echo "::error::Resolved libn4m must be a regular non-symlink file: ${library}" >&2
            exit 1
          fi
          echo "N4M_LIBRARY_PATH=${library}" >> "${GITHUB_ENV}"
          echo "NIRS4ALL_METHODS_LIB=${library}" >> "${GITHUB_ENV}"
          echo "NIRS4ALL_CORE_REQUIRE_METHODS_PARITY=1" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=$(dirname "${library}")" >> "${GITHUB_ENV}"
      - run: cargo fmt --all --check
      - run: cargo build --locked --workspace
      - run: cargo package --locked -p nirs4all
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rust-crate
          path: target/package/*.crate

  windows-archive-durability:
    name: Windows archive durability
    needs: repair-guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Exercise the Windows directory flush and both atomic writers
        run: |
          cargo test --locked -p nirs4all durability::tests::directory_metadata_can_be_flushed_after_publication
          cargo test --locked -p nirs4all archive_v1_publishes_a_relative_target_without_cleanup_error
          cargo test --locked -p nirs4all v2_round_trips_exact_opaque_package_bytes_and_dual_dispatches
      - name: Build the Windows workflow CLI for local qualification
        run: cargo build --locked --release -p nirs4all --bin nirs4all-core-archive
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: core-windows-cli
          path: target/release/nirs4all-core-archive.exe
          if-no-files-found: error

  python:
    needs: repair-guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build twine pyyaml numpy pytest scikit-learn
      - run: python -m build bindings/python --outdir dist/python
      - run: python -m twine check dist/python/*
      - name: Smoke the installed wheel
        run: |
          python scripts/check_python_wheel.py dist/python/*.whl
          python -m pip install --force-reinstall dist/python/*.whl
          python -c "import n4a, nirs4all_core; assert n4a.__aggregate_import__ == 'nirs4all_core'; assert n4a.__version__ == nirs4all_core.__version__; assert hasattr(nirs4all_core, 'predict_methods_archive_v2_matrix')"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: python-${{ matrix.python-version }}
          path: dist/python/*

  npm:
    needs: repair-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: "v0.15.0"
      - run: npm ci --prefix bindings/wasm
      - run: npm run typecheck --prefix bindings/wasm
      - run: mkdir -p dist/npm && npm pack ./bindings/wasm --pack-destination dist/npm
      - name: Smoke the built WASM facade
        run: node --input-type=module -e "import * as core from './bindings/wasm/src/index.js'; if (typeof core.runBrowserPipeline !== 'function') throw new Error('missing public browser workflow');"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-wasm
          path: dist/npm/*

  matlab-octave:
    needs: repair-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Read pinned DAG-ML ref
        id: dag-ml-pin
        shell: python
        run: |
          import os
          from pathlib import Path
          import tomllib

          upstreams = tomllib.loads(Path("compat/upstreams.toml").read_text())["upstream"]
          dag_ml = [item for item in upstreams if item.get("key") == "dag_ml"]
          if len(dag_ml) != 1 or not str(dag_ml[0].get("ref", "")).strip():
              raise SystemExit("compat/upstreams.toml must pin exactly one dag_ml ref")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ref={dag_ml[0]['ref'].strip()}\n")
      - uses: actions/checkout@v7.0.0
        with:
          repository: GBeurier/dag-ml
          path: dag-ml
          ref: ${{ steps.dag-ml-pin.outputs.ref }}
      - name: Install Octave package tools
        timeout-minutes: 12
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave zip
      - name: Run MATLAB/Octave smoke
        timeout-minutes: 3
        run: octave --no-gui --quiet --eval "run('bindings/matlab/tests/smoke.m'); exit(0)"
        env:
          NIRS4ALL_DAG_ML_MATLAB_PATH: ${{ github.workspace }}/dag-ml/bindings/matlab
      - name: Build MATLAB/Octave package
        timeout-minutes: 2
        run: scripts/build-matlab-package.sh dist/matlab
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: matlab-octave
          path: dist/matlab/*
